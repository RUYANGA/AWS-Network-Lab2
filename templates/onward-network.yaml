            .track li::before{content:"";position:absolute;left:4px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--line)}
            .track li::after{content:"";position:absolute;left:8px;top:20px;bottom:0;width:2px;background:var(--line)}
            .track li:last-child{padding-bottom:0}
            .track li:last-child::after{display:none}
            .track .done::before{background:var(--ok)}
            .track .now::before{background:var(--blue);box-shadow:0 0 0 4px rgba(29,111,216,.2)}
            .track span{display:block;font-size:.8rem;color:var(--muted)}
            .ship-note{margin:16px 0 0;font-size:.75rem;color:var(--muted)}
            .block{padding:96px 0}
            .head{max-width:620px;margin:0 0 48px}
            .kicker{margin:0 0 10px;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
            h2{margin:0 0 12px;font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.15;letter-spacing:-.02em}
            .head p:last-child{margin:0;color:var(--muted);font-size:1.05rem}
            .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
            .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;transition:transform .2s,box-shadow .2s,border-color .2s}
            .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:transparent}
            .icon{display:grid;place-items:center;width:46px;height:46px;margin-bottom:18px;border-radius:12px;background:rgba(29,111,216,.1);color:var(--blue)}
            .card h3{margin:0 0 8px;font-size:1.08rem}
            .card p{margin:0;color:var(--muted);font-size:.95rem}
            .alt{background:var(--surface);border-block:1px solid var(--line)}
            .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:0;padding:0;list-style:none;counter-reset:s}
            .steps li{position:relative;counter-increment:s}
            .steps li::before{content:counter(s,decimal-leading-zero);display:grid;place-items:center;width:48px;height:48px;margin-bottom:20px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;position:relative;z-index:1}
            .steps li::after{content:"";position:absolute;top:24px;left:56px;right:-16px;height:2px;background:var(--line)}
            .steps li:last-child::after{display:none}
            .steps b{display:block;margin-bottom:6px;font-size:1.05rem}
            .steps span{color:var(--muted);font-size:.95rem}
            .panel{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border-radius:20px;padding:40px;box-shadow:var(--shadow)}
            .panel-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:32px}
            .panel h2{font-size:clamp(1.4rem,2.8vw,1.9rem);margin:0 0 6px}
            .panel-top p{margin:0;color:rgba(255,255,255,.72)}
            .panel-top strong{color:#fff}
            .live{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;background:rgba(74,222,128,.12);color:#86efac;border:1px solid rgba(74,222,128,.25)}
            .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
            @keyframes pulse{
            0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}
            70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}
            100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
            }
            .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:rgba(255,255,255,.1);border-radius:var(--r);overflow:hidden}
            .stat{background:rgba(6,24,43,.55);padding:20px}
            .stat span{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.6);margin-bottom:6px}
            .stat strong{font-size:1.05rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
            .pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;margin:32px 0 0;padding:28px 0 0;list-style:none;border-top:1px solid rgba(255,255,255,.12)}
            .pillars b{display:block;margin-bottom:4px}
            .pillars span{font-size:.92rem;color:rgba(255,255,255,.7)}
            .hint{margin:24px 0 0;font-size:.88rem;color:rgba(255,255,255,.6)}
            footer{background:var(--navy);color:rgba(255,255,255,.72);padding:64px 0 32px;font-size:.92rem}
            .foot{display:grid;grid-template-columns:2fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1)}
            .foot .logo{color:#fff;margin-bottom:14px}
            .foot p{margin:0;max-width:340px}
            .foot h4{margin:0 0 14px;color:#fff;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em}
            .foot ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
            .foot a:hover{color:#fff}
            .legal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:24px;font-size:.85rem}
            @media (max-width:900px){
            .hero-grid{grid-template-columns:1fr}
            .steps{grid-template-columns:repeat(2,1fr)}
            .steps li::after{display:none}
            }
            @media (max-width:640px){
            .links li:not(:last-child){display:none}
            .hero{padding:56px 0 72px}
            .block{padding:64px 0}
            .steps,.foot{grid-template-columns:1fr}
            .panel{padding:28px 20px}
            }
            @media (prefers-reduced-motion:reduce){
            *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
            }
            </style>
