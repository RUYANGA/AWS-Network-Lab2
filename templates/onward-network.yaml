            echo "ok" > /usr/share/nginx/html/health
            systemctl enable --now nginx

            # Tell CloudFormation this server is serving the page.
            /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource FrontendAutoScalingGroup --region ${AWS::Region} || true

  FrontendAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - PrivateDefaultRouteA
      - PrivateDefaultRouteB
      - WebSubnetARouteTableAssociation
      - WebSubnetBRouteTableAssociation
    CreationPolicy:
      ResourceSignal:
        Count: !Ref FrontendMinSize
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: true
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-${Environment}-orders-web-asg"
      MinSize: !Ref FrontendMinSize
      MaxSize: !Ref FrontendMaxSize
      DesiredCapacity: !Ref FrontendMinSize
      VPCZoneIdentifier:
        - !Ref WebSubnetA
        - !Ref WebSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref FrontendLaunchTemplate
        Version: !GetAtt FrontendLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref FrontendTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-web"
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Owner
          Value: !Ref OwnerName
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true

  # Sales-day peaks: add servers when average CPU passes 60 percent.
  FrontendCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref FrontendAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60

  # ---------------------------------------------------------------------------
  # Internal order services: one per AZ, private IP only
  # ---------------------------------------------------------------------------
  InternalServerA:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateDefaultRouteA
      - InternalSubnetARouteTableAssociation
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref InternalSubnetA
      SecurityGroupIds:
        - !Ref InternalSecurityGroup
      IamInstanceProfile: !Ref ServerInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          mkdir -p /opt/onward
          cat > /opt/onward/order_service.py <<'PY'
          import json, socket
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"service": "${ProjectName}-${Environment}-orders-internal",
                                     "host": socket.gethostname(), "status": "ok"}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body)
          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          cat > /etc/systemd/system/onward-orders.service <<'UNIT'
          [Unit]
          Description=Onward internal order service
          After=network-online.target
          [Service]
          ExecStart=/usr/bin/python3 /opt/onward/order_service.py
          Restart=always
          User=nobody
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now onward-orders
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-internal-a"
        - Key: Tier
          Value: internal
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  InternalServerB:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateDefaultRouteB
      - InternalSubnetBRouteTableAssociation
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref InternalSubnetB
      SecurityGroupIds:
        - !Ref InternalSecurityGroup
      IamInstanceProfile: !Ref ServerInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          mkdir -p /opt/onward
          cat > /opt/onward/order_service.py <<'PY'
          import json, socket
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"service": "${ProjectName}-${Environment}-orders-internal",
                                     "host": socket.gethostname(), "status": "ok"}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body)
          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          cat > /etc/systemd/system/onward-orders.service <<'UNIT'
          [Unit]
          Description=Onward internal order service
          After=network-online.target
          [Service]
          ExecStart=/usr/bin/python3 /opt/onward/order_service.py
          Restart=always
          User=nobody
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now onward-orders
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-internal-b"
        - Key: Tier
          Value: internal
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Cost control: budget alert for the Finance Lead
  # ---------------------------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-${Environment}-network-budget"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  FrontEndUrl:
    Description: Public URL for merchants and customers (served from both AZs).
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "http://${ApplicationLoadBalancer.DNSName}"
  LoadBalancerDnsName:
    Description: Target for the CNAME record at your DNS provider when a custom domain is used.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  VpcId:
    Value: !Ref Vpc
  NatMode:
    Description: NAT Gateway layout in use.
    Value: !Ref NatGatewayMode
  FrontendAutoScalingGroupName:
    Value: !Ref FrontendAutoScalingGroup
  FrontendTargetGroupArn:
    Value: !Ref FrontendTargetGroup
  InternalServerAId:
    Value: !Ref InternalServerA
  InternalServerAPrivateIp:
    Value: !GetAtt InternalServerA.PrivateIp
  InternalServerBId:
    Value: !Ref InternalServerB
  InternalServerBPrivateIp:
    Value: !GetAtt InternalServerB.PrivateIp
  ConnectToInternalServerA:
    Description: Shell on internal server A with Session Manager (no SSH, no keys).
    Value: !Sub "aws ssm start-session --target ${InternalServerA} --region ${AWS::Region}"
  ConnectToInternalServerB:
    Description: Shell on internal server B with Session Manager (no SSH, no keys).
    Value: !Sub "aws ssm start-session --target ${InternalServerB} --region ${AWS::Region}"
  SessionOperatorsPolicyArn:
    Description: Attach to the engineers' permission set or IAM group to allow Session Manager access.
    Value: !Ref SessionOperatorsPolicy
  FlowLogsLogGroupName:
    Value: !Ref FlowLogsLogGroup
