AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - Week 2 lab. Secure, highly available network for the order
  system: internet-facing ALB across two AZs, front-end Auto Scaling group in
  private subnets, internal order services with no inbound internet path,
  NAT egress for updates, SSM Session Manager administration (no SSH, no keys),
  VPC Flow Logs and a budget alert. No inline IAM policies are used.

# Every parameter has a default: CloudFormation Git sync cannot save a stack
# whose parameters lack defaults. Real values are set in deployments/*.yaml.
Parameters:
  ProjectName:
    Type: String
    Default: onward
    AllowedPattern: "^[a-z][a-z0-9]{1,15}$"
    Description: Project tag value and first part of every resource name.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment name used in naming (onward-environment-purpose) and tags.
  OwnerName:
    Type: String
    Default: Merci RUYANGA
    MinLength: 3
    MaxLength: 64
    AllowedPattern: "^[A-Za-z][A-Za-z .'-]+$"
    Description: Your full name. Used for the Owner tag and shown on the front-end page.
  LabName:
    Type: String
    Default: Designing Secure Network for Onward Logistics Order System
    Description: Lab name shown on the front-end page.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    AllowedPattern: "^(10|172|192)\\.[0-9]{1,3}\\.0\\.0/16$"
    Description: VPC CIDR (/16). Six /24 subnets are carved from it.
  NatGatewayMode:
    Type: String
    Default: per-az
    AllowedValues:
      - per-az
      - single
    Description: >-
      per-az = one NAT Gateway per AZ (survives an AZ loss, recommended for prod).
      single = one shared NAT Gateway (about 39 USD/month cheaper, egress fails if its AZ fails).
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    Description: Free Tier eligible instance type (t3.micro for most new accounts, t2.micro for older ones).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI, resolved from the public SSM parameter.
  FrontendMinSize:
    Type: Number
    Default: 2
    MinValue: 2
    Description: Minimum front-end servers (at least one per AZ).
  FrontendMaxSize:
    Type: Number
    Default: 4
    MinValue: 2
    MaxValue: 6
    Description: Maximum front-end servers for sales-day peaks.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Email for budget alerts. Leave empty to skip creating the budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 160
    MinValue: 10
    Description: Monthly cost budget in USD for this environment.
  DomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"
    Description: >-
      Optional custom domain for the front end, e.g. orders.example.com. When set, the stack
      requests an ACM certificate (validated by a DNS record you add at your DNS provider),
      adds an HTTPS listener and redirects HTTP to HTTPS. Leave empty for HTTP on the ALB name.

Conditions:
  NatPerAz: !Equals
    - !Ref NatGatewayMode
    - per-az
  HasDomain: !Not
    - !Equals
      - !Ref DomainName
      - ""
  CreateBudget: !Not
    - !Equals
      - !Ref BudgetEmail
      - ""

Resources:
  # ---------------------------------------------------------------------------
  # VPC and subnets: 3 tiers x 2 AZs
  #   public   -> ALB and NAT Gateways (only tier with a route to the IGW)
  #   web      -> front-end servers (private, reachable only through the ALB)
  #   internal -> order services (private, reachable only from the web tier)
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-vpc"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-igw"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Select
        - 0
        - !Cidr
          - !Ref VpcCidr
          - 6
          - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-a"
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Select
        - 1
        - !Cidr
          - !Ref VpcCidr
          - 6
          - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-b"
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  WebSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Select
        - 2
        - !Cidr
          - !Ref VpcCidr
          - 6
          - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-a"
        - Key: Tier
          Value: web
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  WebSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Select
        - 3
        - !Cidr
          - !Ref VpcCidr
          - 6
          - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-b"
        - Key: Tier
          Value: web
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  InternalSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Select
        - 4
        - !Cidr
          - !Ref VpcCidr
          - 6
          - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-internal-a"
        - Key: Tier
          Value: internal
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  InternalSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Select
        - 5
        - !Cidr
          - !Ref VpcCidr
          - 6
          - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-internal-b"
        - Key: Tier
          Value: internal
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Routing
  # ---------------------------------------------------------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-rt"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-nat-eip-a"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-nat-a"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-nat-eip-b"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-nat-b"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-rt-a"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-rt-b"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  # Outbound only: private subnets reach the internet through NAT. There is no
  # route from the internet into these subnets.
  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If
        - NatPerAz
        - !Ref NatGatewayB
        - !Ref NatGatewayA

  WebSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  WebSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  InternalSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref InternalSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  InternalSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref InternalSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # Free gateway endpoint: Amazon Linux 2023 package repositories are served
  # from S3, so dnf traffic skips the NAT Gateway and its per-GB charge.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB

  # ---------------------------------------------------------------------------
  # Audit trail: VPC Flow Logs (customer managed policy, no inline policy)
  # ---------------------------------------------------------------------------
  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/${Environment}/vpc-flow-logs"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-vpc-flow-logs"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  FlowLogsDeliveryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets VPC Flow Logs write to this environment's log group only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WriteFlowLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
            Resource:
              - !GetAtt FlowLogsLogGroup.Arn
              - !Sub "${FlowLogsLogGroup.Arn}:*"
          - Sid: DescribeLogGroups
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: "*"

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role assumed by VPC Flow Logs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref FlowLogsDeliveryPolicy
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-flow-logs-role"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      MaxAggregationInterval: 600
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-vpc-flow-log"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Security groups (chained by reference, no port 22 anywhere)
  #   internet --80--> ALB --80--> front end --8080--> internal
  # Each group declares its own egress, which replaces the default allow-all.
  # ---------------------------------------------------------------------------
  InternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-orders-internal-sg"
      GroupDescription: Internal order services. Inbound only from the front-end tier. No SSH.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "HTTPS out: package repos, SSM, AWS APIs"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "HTTP out: package mirrors that use plain HTTP"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-internal-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-orders-web-sg"
      GroupDescription: Front-end servers. Inbound HTTP only from the ALB. No SSH.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "HTTPS out: package repos, SSM, AWS APIs"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "HTTP out: package mirrors that use plain HTTP"
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref InternalSecurityGroup
          Description: "Calls to internal order services"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-web-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-orders-alb-sg"
      GroupDescription: Public load balancer. HTTP from the internet, forwards only to front-end servers.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "Merchants and customers (HTTP)"
        - !If
          - HasDomain
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
            Description: "Merchants and customers (HTTPS)"
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          DestinationSecurityGroupId: !Ref FrontendSecurityGroup
          Description: "Forward to front-end servers"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-alb-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  # Ingress rules as separate resources to avoid circular references.
  FrontendIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FrontendSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: HTTP from the ALB only

  InternalIngressFromFrontend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InternalSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref FrontendSecurityGroup
      Description: Order service API from the front-end tier only

  # ---------------------------------------------------------------------------
  # IAM for servers: AWS managed policy only, no keys, no inline policies
  # ---------------------------------------------------------------------------
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: EC2 role so servers register with SSM Session Manager (no SSH keys needed).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-server-role"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ServerRole

  # Engineers' side of "no shared keys": attach this policy to the engineers'
  # IAM Identity Center permission set or IAM group from Week 1. It only allows
  # shell sessions on this project's servers in this environment.
  SessionOperatorsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub "Session Manager access to ${ProjectName}-${Environment} servers only."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartSessionOnProjectServers
            Effect: Allow
            Action: ssm:StartSession
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: !Ref ProjectName
                aws:ResourceTag/Environment: !Ref Environment
          - Sid: UseShellDocument
            Effect: Allow
            Action: ssm:StartSession
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/SSM-SessionManagerRunShell"
          - Sid: ManageOwnSessions
            Effect: Allow
            Action:
              - ssm:TerminateSession
              - ssm:ResumeSession
            Resource: !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:session/${!aws:userid}-*"
          - Sid: SeeServers
            Effect: Allow
            Action:
              - ssm:DescribeInstanceInformation
              - ssm:DescribeSessions
              - ssm:GetConnectionStatus
              - ec2:DescribeInstances
            Resource: "*"

  # ---------------------------------------------------------------------------
  # Front end: internet-facing ALB in two AZs + Auto Scaling group
  # ---------------------------------------------------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: PublicDefaultRoute
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-orders-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: load_balancing.cross_zone.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-alb"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-orders-web-tg"
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-web-tg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - !If
          - HasDomain
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              Host: "#{host}"
              Path: "/#{path}"
              Query: "#{query}"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref FrontendTargetGroup

  # Custom domain: free public certificate. CloudFormation waits until the
  # validation CNAME shown in the stack events is added at the DNS provider.
  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-orders-cert"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Environment
          Value: !Ref Environment

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasDomain
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref FrontendCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  FrontendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${Environment}-orders-web-lt"
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !Sub "${ProjectName}-${Environment}-orders-web-lt"
            - Key: Project
              Value: !Ref ProjectName
            - Key: Owner
              Value: !Ref OwnerName
            - Key: Environment
              Value: !Ref Environment
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt ServerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref FrontendSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-${Environment}-orders-web"
              - Key: Tier
                Value: web
              - Key: Project
                Value: !Ref ProjectName
              - Key: Owner
                Value: !Ref OwnerName
              - Key: Environment
                Value: !Ref Environment
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-${Environment}-orders-web-volume"
              - Key: Project
                Value: !Ref ProjectName
              - Key: Owner
                Value: !Ref OwnerName
              - Key: Environment
                Value: !Ref Environment
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Front-end bootstrap: install nginx and publish the lab page.
            set -euxo pipefail
            dnf install -y nginx aws-cfn-bootstrap

            TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)

            cat > /usr/share/nginx/html/index.html <<HTML
            <!doctype html>
            <html lang="en">
            <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#0a2540">
            <title>Onward Logistics | Freight, Warehousing and Delivery</title>
            <style>
            :root{--bg:#f6f8fb;--surface:#fff;--ink:#0a1628;--muted:#5b6779;--line:#e3e8ef;--navy:#0a2540;--navy-2:#123a63;--blue:#1d6fd8;--accent:#f5a524;--accent-ink:#1f1300;--ok:#15803d;--ok-bg:#e7f6ec;--r:14px;--shadow:0 1px 2px rgba(10,22,40,.06),0 8px 24px rgba(10,22,40,.06)}
            @media (prefers-color-scheme:dark){
            :root{--bg:#070d16;--surface:#0f1826;--ink:#e7edf5;--muted:#97a3b6;--line:#1f2b3c;--navy:#06182b;--navy-2:#0d2c4c;--blue:#5aa2ff;--ok:#4ade80;--ok-bg:#0f2a1a;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
            }
            *{box-sizing:border-box}
            html{scroll-behavior:smooth}
            body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;font-family:system-ui,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif}
            a{color:inherit;text-decoration:none}
            a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
            svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
            .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
            .skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:20}
            .skip:focus{left:8px}
            header{position:sticky;top:0;z-index:10;background:rgba(10,37,64,.92);backdrop-filter:blur(10px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
            .nav{display:flex;align-items:center;justify-content:space-between;gap:24px;height:68px}
            .logo{display:flex;white-space:nowrap;align-items:center;gap:10px;font-weight:700;font-size:1.08rem;letter-spacing:-.01em}
            .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink)}
            .links{display:flex;align-items:center;gap:28px;margin:0;padding:0;list-style:none;font-size:.94rem}
            .links a{opacity:.8;transition:opacity .15s}
            .links a:hover{opacity:1}
            .btn{display:inline-flex;white-space:nowrap;align-items:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:600;font-size:.95rem;transition:transform .15s,box-shadow .15s,background .15s}
            .btn:hover{transform:translateY(-1px)}
            .btn-accent{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(245,165,36,.3)}
            .btn-line{border:1px solid rgba(255,255,255,.28);color:#fff}
            .btn-line:hover{background:rgba(255,255,255,.08)}
            .links .btn{opacity:1;padding:9px 16px}
            .hero{background:radial-gradient(1200px 500px at 85% -10%,rgba(29,111,216,.45),transparent 60%),linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:88px 0 104px;overflow:hidden}
            .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
            h1{margin:0 0 20px;font-size:clamp(2.2rem,5.2vw,3.6rem);line-height:1.08;letter-spacing:-.03em}
            h1 span{color:var(--accent)}
            .lead{margin:0 0 32px;max-width:540px;font-size:1.12rem;color:rgba(255,255,255,.78)}
            .cta{display:flex;flex-wrap:wrap;gap:12px}
            .trust{display:flex;flex-wrap:wrap;gap:8px 24px;margin:40px 0 0;padding:0;list-style:none;font-size:.88rem;color:rgba(255,255,255,.7)}
            .trust li{display:flex;align-items:center;gap:8px}
            .trust li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
            .ship{background:var(--surface);color:var(--ink);border-radius:18px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
            .ship-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
            .ship small{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
            .ship-top strong{font-size:1.1rem;font-variant-numeric:tabular-nums}
            .badge{padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:rgba(29,111,216,.12);color:var(--blue);white-space:nowrap}
            .track{margin:0;padding:0;list-style:none}
